<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 — Ponnai பொன்நாய்</title>

    <!-- Use the same stylesheet as the main website -->
    <link rel="stylesheet" href="/style.css">

    <style>

        /* =========================================
           404 PAGE
        ========================================= */
body {
    padding-top: 100px;
    font-family: et-book, Palatino, "Palatino Linotype", "Palatino LT STD", "Book Antiqua", Georgia, serif;
}
        .error-page {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;

            padding: 80px 30px;
        }

        .error-number {
            font-size: clamp(6rem, 18vw, 15rem);
            line-height: 0.8;
            font-weight: 400;
            letter-spacing: -0.06em;
            margin: 0 0 50px 0;
        }

        .error-page h1 {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin: 0 0 20px 0;
        }

        .error-page p {
            font-size: 1rem;
            line-height: 1.6;
            margin: 0 0 35px 0;
        }

        .error-home {
            font-size: 1rem;
            text-decoration: underline;
            text-underline-offset: 4px;
            transition: opacity 0.2s ease;
        }

        .error-home:hover {
            opacity: 0.5;
        }

        .error-footer {
            text-align: center;
            margin-top: 40px;
            padding-bottom: 50px;
        }

        .error-footer .english {
            display: block;
            font-size: 1rem;
            margin-bottom: 3px;
        }

        .error-footer .tamil {
            display: block;
            font-size: 1rem;
        }

        .error-footer .golden-dog {
            display: block;
            font-size: 0.75rem;
            margin-top: 8px;
            letter-spacing: 0.08em;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .error-page {
                min-height: 65vh;
                padding: 60px 20px;
            }

            .error-number {
                margin-bottom: 40px;
            }

            .error-page h1 {
                font-size: 0.95rem;
            }

            .error-page p {
                font-size: 0.95rem;
                max-width: 280px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         404 CONTENT
    ========================================= -->

    <main class="error-page">

        <div class="error-number">
            404
        </div>

        <h1>
            Page Not Found
        </h1>

        <p>
            This page does not exist...
        </p>

        <a href="https://www.ponnai.net/" class="error-home">
            ← Return to Ponnai பொன்நாய்
        </a>

    </main>



</body>

</html>
